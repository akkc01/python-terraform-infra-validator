parameters:

- name: jobName
  type: string
  default: terraform_init

- name: displayName
  type: string
  default: "Terraform Init"

- name: workingDirectory
  type: string

- name: serviceConnection
  type: string

- name: backendResourceGroup
  type: string

- name: backendStorageAccount
  type: string

- name: backendContainer
  type: string

- name: backendStateFile
  type: string


jobs:
- job: ${{ parameters.jobName }}
  displayName: ${{ parameters.displayName }}

  steps:
  - checkout: self
    displayName: "Checkout Repository"


  - task: TerraformTask@5
    displayName: "Terraform Init"
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: ${{ parameters.workingDirectory }}
      backendServiceArm: ${{ parameters.serviceConnection }}
      backendAzureRmResourceGroupName: ${{ parameters.backendResourceGroup }}
      backendAzureRmStorageAccountName: ${{ parameters.backendStorageAccount }}
      backendAzureRmContainerName: ${{ parameters.backendContainer }}
      backendAzureRmKey: ${{ parameters.backendStateFile }}

  - task: TerraformTask@5
    displayName: "Terraform Validate"
    inputs:
      provider: 'azurerm'
      command: 'validate'
      workingDirectory: ${{ parameters.workingDirectory }}

  - task: TerraformTask@5
    displayName: "Terraform Format"
    inputs:
      provider: 'azurerm'
      command: 'custom'
      customCommand: 'fmt'
      commandOptions: '--recursive'
      outputTo: 'console'
      environmentServiceNameAzureRM: ${{ parameters.serviceConnection }}